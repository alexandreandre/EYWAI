# Déploie l'environnement de test (Cloud Run) depuis la branche choisie.
#
# Ne touche JAMAIS la production : services, base et variables sont ceux du
# test. C'est ce qui permet de faire valider une nouveauté avant de la livrer.
#
# L'ordre des étapes est imposé : VITE_API_URL est figé au build du frontend,
# il faut donc connaître l'URL du backend de test avant de construire l'image
# frontend — d'où le déploiement backend en premier.
name: Deploy test env

on:
  workflow_dispatch:
    inputs:
      migration:
        description: "Migration à appliquer d'abord (nom du fichier dans supabase/migrations, vide = aucune)"
        required: false
        type: string

concurrency:
  group: deploy-test-env
  cancel-in-progress: false

permissions:
  contents: read

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  BACKEND_SERVICE: sirh-backend-test
  FRONTEND_SERVICE: sirh-frontend-test

jobs:
  # ---------------------------------------------------------------------------
  # 0) Migration — optionnelle, nommée par l'opérateur.
  #
  # Ce déploiement ne joue aucune migration automatiquement, et c'est
  # volontaire : la resynchro depuis la production ne copie que le schéma
  # `public`, donc l'historique `supabase_migrations` du test n'est pas fiable
  # et un `supabase db push` y rejouerait potentiellement tout l'historique.
  # On applique donc un fichier à la fois, choisi explicitement.
  #
  # Les migrations du dépôt sont idempotentes (ADD COLUMN IF NOT EXISTS,
  # INSERT ... WHERE NOT EXISTS) : relancer le même fichier est sans effet.
  #
  # Bloquant : si la migration échoue, on ne déploie pas de code qui en dépend.
  # ---------------------------------------------------------------------------
  migrate:
    name: Migration base de test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.migration != ''
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le secret et le fichier
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
          MIGRATION: ${{ inputs.migration }}
        run: |
          if [ -z "$TEST_DB_URL" ]; then
            echo "::error::SUPABASE_TEST_DB_URL absent dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Nom de fichier seul : interdit de sortir du dossier des migrations.
          case "$MIGRATION" in
            */*) echo "::error::Donner le nom du fichier seul, sans chemin."; exit 1 ;;
          esac
          if [ ! -f "supabase/migrations/$MIGRATION" ]; then
            echo "::error::supabase/migrations/$MIGRATION introuvable sur cette branche."
            exit 1
          fi
          echo "Migration à appliquer : $MIGRATION"
          cat "supabase/migrations/$MIGRATION"

      - name: Appliquer
        env:
          # ON_ERROR_STOP : sans lui, psql passerait au vert sur une migration
          # dont une instruction a échoué.
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
          MIGRATION: ${{ inputs.migration }}
        run: |
          psql "$TEST_DB_URL" \
            --set ON_ERROR_STOP=1 \
            --single-transaction \
            -f "supabase/migrations/$MIGRATION"
          echo "Migration appliquée."

  deploy:
    name: Build & deploy test env
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [migrate]
    # `always()` : le job migrate est sauté quand aucune migration n'est
    # demandée, et un `needs` sauté ferait sauter le déploiement avec lui.
    if: always() && needs.migrate.result != 'failure'
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets requis
        env:
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          TEST_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
          REDIRECT: ${{ secrets.TEST_EMAIL_REDIRECT_TO }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$SA_KEY" ]   && missing="$missing GCP_SA_KEY(secret)"
          [ -z "$TEST_URL" ] && missing="$missing SUPABASE_TEST_URL(secret)"
          [ -z "$TEST_KEY" ] && missing="$missing SUPABASE_TEST_KEY(secret)"
          [ -z "$REDIRECT" ] && missing="$missing TEST_EMAIL_REDIRECT_TO(secret)"
          [ -z "$PROJECT" ]  && missing="$missing GCP_PROJECT_ID(var)"
          if [ -n "$missing" ]; then
            echo "::error::Manquant dans Settings → Secrets and variables → Actions :$missing"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - run: gcloud auth configure-docker --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Pre-pull images de base (mirror GCR, retry)
        run: |
          for img in \
            "mirror.gcr.io/library/python:3.11-slim" \
            "mirror.gcr.io/library/node:22-alpine" \
            "mirror.gcr.io/library/nginx:alpine"; do
            for attempt in 1 2 3; do
              docker pull "$img" && break
              [ "$attempt" -eq 3 ] && { echo "::error::Échec pull $img"; exit 1; }
              sleep 20
            done
          done

      # ---------------------------------------------------------------------
      # 1) Backend — l'image porte les garde-fous ; les variables les activent.
      # ---------------------------------------------------------------------
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: gcr.io/${{ vars.GCP_PROJECT_ID }}/sirh-backend:test-${{ github.sha }}

      # SUPABASE_SERVICE_KEY manquait : le moteur de paie l'exige (ContextePaie)
      # et sortait « Variables d'environnement Supabase non configurées » — aucun
      # bulletin n'a jamais pu être généré sur le test. La production la définit
      # déjà. Même valeur que SUPABASE_KEY côté test, comme en production.
      - name: Deploy backend test
        run: |
          gcloud run deploy "$BACKEND_SERVICE" \
            --image "gcr.io/${{ vars.GCP_PROJECT_ID }}/sirh-backend:test-${{ github.sha }}" \
            --region "$GCP_REGION" \
            --memory 2Gi --timeout 900 --allow-unauthenticated \
            --set-env-vars "^##^APP_ENV=test##EMAIL_FORCE_REDIRECT_TO=${{ secrets.TEST_EMAIL_REDIRECT_TO }}##SUPABASE_URL=${{ secrets.SUPABASE_TEST_URL }}##SUPABASE_KEY=${{ secrets.SUPABASE_TEST_KEY }}##SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_TEST_SERVICE_KEY }}##COPILOT_RH_DATA_ENABLED=true##GITHUB_REPO=${{ github.repository }}"

      - name: Relever l'URL du backend de test
        id: back
        run: |
          url=$(gcloud run services describe "$BACKEND_SERVICE" \
            --region "$GCP_REGION" --format 'value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Backend de test : $url"

      # ---------------------------------------------------------------------
      # 2) Frontend — VITE_API_URL et VITE_APP_ENV sont figés au build.
      # ---------------------------------------------------------------------
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ steps.back.outputs.url }}
            VITE_APP_ENV=test
            VITE_APP_BUILD_ID=${{ github.sha }}
          tags: gcr.io/${{ vars.GCP_PROJECT_ID }}/sirh-frontend:test-${{ github.sha }}

      - name: Deploy frontend test
        run: |
          gcloud run deploy "$FRONTEND_SERVICE" \
            --image "gcr.io/${{ vars.GCP_PROJECT_ID }}/sirh-frontend:test-${{ github.sha }}" \
            --region "$GCP_REGION" --allow-unauthenticated

      # ---------------------------------------------------------------------
      # 3) CORS — sans cette étape, le navigateur rejette tous les appels API.
      # ---------------------------------------------------------------------
      - name: Autoriser l'origine du frontend de test
        id: front
        run: |
          url=$(gcloud run services describe "$FRONTEND_SERVICE" \
            --region "$GCP_REGION" --format 'value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"

          # Cloud Run expose DEUX URL pour le même service :
          #   https://<service>-<hash>-<region>.a.run.app  (renvoyée par describe)
          #   https://<service>-<numéro de projet>.<région>.run.app
          # Les deux sont valides et la console affiche la seconde. N'autoriser
          # que celle de describe suffit à faire rejeter tous les appels API
          # quand quelqu'un ouvre l'autre. On déclare donc les deux.
          # Le numéro de projet vient d'une variable de dépôt : l'API
          # cloudresourcemanager est désactivée pour le compte de service de
          # déploiement, donc `gcloud projects describe` échoue ici.
          num="${{ vars.GCP_PROJECT_NUMBER }}"
          origines="$url"
          if [ -n "$num" ]; then
            origines="$origines,https://${FRONTEND_SERVICE}-${num}.${GCP_REGION}.run.app"
          else
            echo "::warning::GCP_PROJECT_NUMBER absent — une seule forme d'URL autorisée en CORS."
          fi

          # ^##^ : délimiteur explicite, sans quoi gcloud prendrait la virgule
          # de la liste d'origines pour un séparateur de variables.
          gcloud run services update "$BACKEND_SERVICE" --region "$GCP_REGION" \
            --update-env-vars "^##^ALLOWED_ORIGINS_EXTRA=$origines"
          echo "Origines autorisées : $origines"

      - name: Smoke tests
        run: |
          BACK="${{ steps.back.outputs.url }}"
          FRONT="${{ steps.front.outputs.url }}"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$BACK/health"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$BACK/openapi.json"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$FRONT/"
          # L'appel avec l'en-tête Origin du frontend de test doit être accepté.
          curl -fsS -o /dev/null -H "Origin: $FRONT" "$BACK/health"

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Environnement de test"
            echo ""
            echo "- Backend : ${{ steps.back.outputs.url }}"
            echo "- Frontend : ${{ steps.front.outputs.url }}"
            echo "- Branche déployée : ${{ github.ref_name }}"
            echo "- Migration appliquée : ${{ inputs.migration || 'aucune' }}"
          } >> "$GITHUB_STEP_SUMMARY"
