# Déploie le site de paie (services Cloud Run et base « test ») depuis la
# branche choisie.
#
# Ce site porte la paie réelle d'un client depuis septembre 2026 : ce n'est plus
# un bac à sable. Il ne touche pas l'ancienne production (services, base et
# variables sont ceux du projet « test »).
#
# Garde-fous (audit du 03/11/2026, A3) :
# - refus si la CI n'est pas verte sur le commit déployé (ou, pour un commit de
#   documentation seule, sur le dernier commit de code avant lui) ;
# - les jobs qui écrivent passent par l'environnement GitHub `paie-reelle`
#   (relecteur et branches autorisées s'y règlent) ;
# - chaque déploiement réussi pose l'étiquette `paie-AAAA-MM-JJ.N` (date de
#   Paris), gravée aussi dans les images : /health et le bas du menu la montrent.
#
# L'ordre des étapes est imposé : VITE_API_URL est figé au build du frontend,
# il faut donc connaître l'URL du backend de test avant de construire l'image
# frontend — d'où le déploiement backend en premier.
name: Deploy test env

on:
  workflow_dispatch:
    inputs:
      migration:
        description: "Migration à appliquer d'abord (nom du fichier dans supabase/migrations, vide = aucune)"
        required: false
        type: string

concurrency:
  group: deploy-test-env
  cancel-in-progress: false

permissions:
  contents: read

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  BACKEND_SERVICE: sirh-backend-test
  FRONTEND_SERVICE: sirh-frontend-test

jobs:
  # ---------------------------------------------------------------------------
  # Garde — CI verte sur ce commit, et version de ce déploiement.
  # ---------------------------------------------------------------------------
  garde:
    name: CI verte et version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Le commit de référence est le plus récent de la branche (en suivant le
      # premier parent) qui a une CI. Entre lui et le commit déployé, seuls des
      # fichiers de documentation sont admis : la CI les ignore (paths-ignore).
      # Une CI en cours est attendue jusqu'à 25 minutes.
      - name: Exiger une CI verte
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          ref=""; run=""
          for c in $(git rev-list --first-parent --max-count=40 "$GITHUB_SHA"); do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$c&per_page=50" \
              --jq '[.workflow_runs[]] | sort_by(.created_at) | last | .id // empty')
            if [ -n "$run" ]; then ref="$c"; break; fi
          done
          if [ -z "$ref" ]; then
            echo "::error::Aucune CI trouvée sur ce commit ni sur les 40 précédents : pousser la branche et attendre la CI."
            exit 1
          fi
          if [ "$ref" != "$GITHUB_SHA" ]; then
            code=$(git diff --name-only "$ref" "$GITHUB_SHA" | grep -Ev '^docs/|\.md$' || true)
            if [ -n "$code" ]; then
              echo "::error::Pas de CI sur ce commit, et du code a changé depuis ${ref:0:8}, le dernier commit qui en a une :"
              echo "$code"
              exit 1
            fi
            echo "Commit de documentation seule : CI de référence ${ref:0:8}."
          fi
          for i in $(seq 1 75); do
            etat=$(gh api "repos/$REPO/actions/runs/$run" --jq '.status + " " + (.conclusion // "")')
            case "$etat" in
              "completed success") echo "CI verte sur ${ref:0:8} (run $run)."; exit 0 ;;
              completed*) echo "::error::CI ${etat#completed } sur ${ref:0:8} (run $run) : on ne déploie pas."; exit 1 ;;
            esac
            [ "$i" = 1 ] && echo "CI en cours sur ${ref:0:8} (run $run), attente…"
            sleep 20
          done
          echo "::error::CI toujours en cours après 25 minutes (run $run)."
          exit 1

      - name: Calculer la version
        id: version
        run: |
          set -eu
          jour=$(TZ=Europe/Paris date +%Y-%m-%d)
          dernier=$(git tag -l "paie-$jour.*" | sed "s/^paie-$jour\.//" | sort -n | tail -1)
          version="paie-$jour.$(( ${dernier:-0} + 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version de ce déploiement : $version"
          # Un déploiement qui ne contient pas la version déjà en ligne la retire
          # du site : on le dit, sans bloquer (retour arrière volontaire possible).
          en_ligne=$(git tag -l 'paie-*' --sort=-creatordate | head -1)
          {
            echo "### Déploiement $version"
            echo ""
            echo "- Branche : ${{ github.ref_name }} @ ${GITHUB_SHA:0:8}"
            if [ -n "$en_ligne" ] && ! git merge-base --is-ancestor "$en_ligne" "$GITHUB_SHA"; then
              echo "- **Attention** : ce commit ne contient pas $en_ligne, la dernière version déployée. Ce qu'elle apportait disparaîtra du site."
              echo "::warning::Ce commit ne contient pas $en_ligne (dernière version déployée)."
            elif [ -n "$en_ligne" ]; then
              echo "- Contient $en_ligne, la dernière version déployée."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 0) Migration — optionnelle, nommée par l'opérateur.
  #
  # Ce déploiement ne joue aucune migration automatiquement, et c'est
  # volontaire : la resynchro depuis la production ne copie que le schéma
  # `public`, donc l'historique `supabase_migrations` du test n'est pas fiable
  # et un `supabase db push` y rejouerait potentiellement tout l'historique.
  # On applique donc un fichier à la fois, choisi explicitement.
  #
  # Les migrations du dépôt sont idempotentes (ADD COLUMN IF NOT EXISTS,
  # INSERT ... WHERE NOT EXISTS) : relancer le même fichier est sans effet.
  #
  # Bloquant : si la migration échoue, on ne déploie pas de code qui en dépend.
  # Depuis le 26/09/2026, la migration est aussi inscrite au registre
  # supabase_migrations, dans la même transaction.
  # ---------------------------------------------------------------------------
  migrate:
    name: Migration base de test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [garde]
    if: inputs.migration != ''
    environment: paie-reelle
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le secret et le fichier
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
          MIGRATION: ${{ inputs.migration }}
        run: |
          if [ -z "$TEST_DB_URL" ]; then
            echo "::error::SUPABASE_TEST_DB_URL absent dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Nom de fichier seul : interdit de sortir du dossier des migrations.
          case "$MIGRATION" in
            */*) echo "::error::Donner le nom du fichier seul, sans chemin."; exit 1 ;;
          esac
          # Format imposé : il sert aussi à inscrire la migration au registre.
          if ! printf '%s' "$MIGRATION" | grep -Eq '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
            echo "::error::Nom attendu : AAAAMMJJHHMMSS_nom_en_minuscules.sql"
            exit 1
          fi
          if [ ! -f "supabase/migrations/$MIGRATION" ]; then
            echo "::error::supabase/migrations/$MIGRATION introuvable sur cette branche."
            exit 1
          fi
          echo "Migration à appliquer : $MIGRATION"
          cat "supabase/migrations/$MIGRATION"

      - name: Appliquer
        env:
          # ON_ERROR_STOP : sans lui, psql passerait au vert sur une migration
          # dont une instruction a échoué.
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
          MIGRATION: ${{ inputs.migration }}
        run: |
          # La migration est inscrite au registre supabase_migrations dans la
          # même transaction : soit les deux passent, soit aucune. Sans cette
          # inscription, le registre de la base de test divergeait à chaque
          # migration appliquée ici (audit du 25/09/2026).
          VERSION="${MIGRATION%%_*}"
          NOM="${MIGRATION#*_}"; NOM="${NOM%.sql}"
          printf "insert into supabase_migrations.schema_migrations (version, name, created_by) values ('%s', '%s', 'deploy-test-env') on conflict (version) do nothing;\n" \
            "$VERSION" "$NOM" > /tmp/registre.sql
          psql "$TEST_DB_URL" \
            --set ON_ERROR_STOP=1 \
            --single-transaction \
            -f "supabase/migrations/$MIGRATION" \
            -f /tmp/registre.sql
          echo "Migration appliquée et inscrite au registre ($VERSION, $NOM)."

  deploy:
    name: Build & deploy test env
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [garde, migrate]
    # `always()` : le job migrate est sauté quand aucune migration n'est
    # demandée, et un `needs` sauté ferait sauter le déploiement avec lui.
    # La garde, elle, doit avoir réussi.
    if: always() && needs.garde.result == 'success' && needs.migrate.result != 'failure'
    environment: paie-reelle
    permissions:
      contents: write   # poser l'étiquette de version
    env:
      VERSION: ${{ needs.garde.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets requis
        env:
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          TEST_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
          REDIRECT: ${{ secrets.TEST_EMAIL_REDIRECT_TO }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$SA_KEY" ]   && missing="$missing GCP_SA_KEY(secret)"
          [ -z "$TEST_URL" ] && missing="$missing SUPABASE_TEST_URL(secret)"
          [ -z "$TEST_KEY" ] && missing="$missing SUPABASE_TEST_KEY(secret)"
          [ -z "$REDIRECT" ] && missing="$missing TEST_EMAIL_REDIRECT_TO(secret)"
          [ -z "$PROJECT" ]  && missing="$missing GCP_PROJECT_ID(var)"
          if [ -n "$missing" ]; then
            echo "::error::Manquant dans Settings → Secrets and variables → Actions :$missing"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - run: gcloud auth configure-docker --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Pre-pull images de base (mirror GCR, retry)
        run: |
          for img in \
            "mirror.gcr.io/library/python:3.11-slim" \
            "mirror.gcr.io/library/node:22-alpine" \
            "mirror.gcr.io/library/nginx:alpine"; do
            for attempt in 1 2 3; do
              docker pull "$img" && break
              [ "$attempt" -eq 3 ] && { echo "::error::Échec pull $img"; exit 1; }
              sleep 20
            done
          done

      # ---------------------------------------------------------------------
      # 1) Backend — l'image porte les garde-fous ; les variables les activent.
      # ---------------------------------------------------------------------
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: gcr.io/${{ vars.GCP_PROJECT_ID }}/sirh-backend:test-${{ github.sha }}
          build-args: |
            MARTINE_VERSION=${{ env.VERSION }}
            MARTINE_COMMIT=${{ github.sha }}

      # SUPABASE_SERVICE_KEY manquait : le moteur de paie l'exige (ContextePaie)
      # et sortait « Variables d'environnement Supabase non configurées » — aucun
      # bulletin n'a jamais pu être généré sur le test. La production la définit
      # déjà. Même valeur que SUPABASE_KEY côté test, comme en production.
      #
      # FROM_NAME : nom d'expéditeur des e-mails (« Martine », le nom du produit).
      # Posé ici parce que la console portait encore l'ancien nom du produit.
      #
      # OPENROUTER_API_KEY : sans cette clé, le remplissage calendrier IA
      # répond 503 et le copilote 500 (ValueError « pas configuré »). Même
      # secret qu'en prod.
      #
      # `--update-env-vars`, jamais `--set-env-vars` : ce dernier remplaçait
      # TOUTES les variables du service à chaque déploiement, et effaçait
      # celles qu'on ne peut pas mettre dans ce dépôt public (05/10/2026).
      # Ici, chaque déploiement repose ses variables et garde les autres.
      #
      # À poser UNE FOIS, à la main, dans la console Cloud Run (service
      # sirh-backend-test → Modifier et déployer une nouvelle révision →
      # Variables et secrets). Elles survivent désormais aux déploiements :
      #   - SECRET_ENCRYPTION_KEY : chiffre les secrets gardés en base
      #     (connecteur comptable). Sans elle, le connecteur lève une erreur.
      #     Même valeur que le secret GitHub du même nom, sinon les secrets
      #     déjà chiffrés ne se relisent plus.
      #   - ACTIVATION_EMAIL_ALLOWLIST : adresses servies en direct malgré la
      #     redirection du test (activation, mot de passe oublié, tickets).
      #     Y mettre l'adresse de la gestionnaire de paie et contact@eywai.fr,
      #     sinon ses e-mails et les tickets de support partent vers
      #     TEST_EMAIL_REDIRECT_TO. Adresses personnelles : hors dépôt.
      #   - SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, FROM_EMAIL (et
      #     SMTP_SECURITY si ce n'est pas starttls) : seulement si l'écran
      #     super-admin « Mails automatiques » n'est pas actif (sa
      #     configuration en base passe avant ces variables). Sans l'un ni
      #     l'autre, aucun e-mail ne part.
      #   - BADGEUSE_QR_SECRET : signe les QR de la badgeuse. Sans elle, la
      #     signature repose sur une valeur écrite dans ce dépôt public. La
      #     poser invalide les QR déjà imprimés.
      #   - PISTE_CLIENT_ID, PISTE_CLIENT_SECRET : import des conventions
      #     collectives depuis Légifrance (admin plateforme). Facultatif pour
      #     la paie. Mêmes valeurs que les secrets GitHub du même nom.
      #   - ANTHROPIC_API_KEY (secret GitHub) : relecture IA des bulletins. Sans elle,
      #     l'écran dit que la relecture n'est pas branchée. ANTHROPIC_WORKSPACE_ID et
      #     RELECTURE_IA_COMPTES (variables GitHub) : facultatives.
      # Ne pas poser GITHUB_DISPATCH_TOKEN : il rouvrirait la resynchro de la
      # base de test, verrouillée. FRONTEND_URL et ALLOWED_ORIGINS_EXTRA sont
      # posées plus bas, après le déploiement du frontend.
      - name: Deploy backend test
        run: |
          gcloud run deploy "$BACKEND_SERVICE" \
            --image "gcr.io/${{ vars.GCP_PROJECT_ID }}/sirh-backend:test-${{ github.sha }}" \
            --region "$GCP_REGION" \
            --memory 4Gi --cpu 2 --no-cpu-throttling --timeout 900 --allow-unauthenticated \
            --update-env-vars "^##^APP_ENV=test##EMAIL_FORCE_REDIRECT_TO=${{ secrets.TEST_EMAIL_REDIRECT_TO }}##SUPABASE_URL=${{ secrets.SUPABASE_TEST_URL }}##SUPABASE_KEY=${{ secrets.SUPABASE_TEST_KEY }}##SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_TEST_SERVICE_KEY }}##OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}##FROM_NAME=Martine##TIMESHEET_EXTRACT_MODE=native##COPILOT_RH_DATA_ENABLED=true##GITHUB_REPO=${{ github.repository }}##ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}##ANTHROPIC_WORKSPACE_ID=${{ vars.ANTHROPIC_WORKSPACE_ID }}##RELECTURE_IA_COMPTES=${{ vars.RELECTURE_IA_COMPTES }}"

      - name: Relever l'URL du backend de test
        id: back
        run: |
          url=$(gcloud run services describe "$BACKEND_SERVICE" \
            --region "$GCP_REGION" --format 'value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Backend de test : $url"

      # ---------------------------------------------------------------------
      # 2) Frontend — VITE_API_URL et VITE_APP_ENV sont figés au build.
      # ---------------------------------------------------------------------
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ steps.back.outputs.url }}
            VITE_APP_ENV=test
            VITE_APP_BUILD_ID=${{ github.sha }}
            VITE_APP_VERSION=${{ env.VERSION }}
          tags: gcr.io/${{ vars.GCP_PROJECT_ID }}/sirh-frontend:test-${{ github.sha }}

      - name: Deploy frontend test
        run: |
          gcloud run deploy "$FRONTEND_SERVICE" \
            --image "gcr.io/${{ vars.GCP_PROJECT_ID }}/sirh-frontend:test-${{ github.sha }}" \
            --region "$GCP_REGION" --allow-unauthenticated

      # ---------------------------------------------------------------------
      # 3) CORS — sans cette étape, le navigateur rejette tous les appels API.
      #    Et FRONTEND_URL — sans elle, les liens des e-mails d'activation et
      #    de mot de passe oublié pointent vers http://localhost:8080.
      # ---------------------------------------------------------------------
      - name: Autoriser l'origine du frontend de test
        id: front
        run: |
          url=$(gcloud run services describe "$FRONTEND_SERVICE" \
            --region "$GCP_REGION" --format 'value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"

          # Cloud Run expose DEUX URL pour le même service :
          #   https://<service>-<hash>-<region>.a.run.app  (renvoyée par describe)
          #   https://<service>-<numéro de projet>.<région>.run.app
          # Les deux sont valides et la console affiche la seconde. N'autoriser
          # que celle de describe suffit à faire rejeter tous les appels API
          # quand quelqu'un ouvre l'autre. On déclare donc les deux.
          # Le numéro de projet vient d'une variable de dépôt : l'API
          # cloudresourcemanager est désactivée pour le compte de service de
          # déploiement, donc `gcloud projects describe` échoue ici.
          num="${{ vars.GCP_PROJECT_NUMBER }}"
          origines="$url"
          # Adresse des liens envoyés par e-mail : celle que la console
          # affiche et que la gestionnaire de paie utilise.
          adresse_publique="$url"
          if [ -n "$num" ]; then
            adresse_publique="https://${FRONTEND_SERVICE}-${num}.${GCP_REGION}.run.app"
            origines="$origines,$adresse_publique"
          else
            echo "::warning::GCP_PROJECT_NUMBER absent — une seule forme d'URL autorisée en CORS."
          fi

          # ^##^ : délimiteur explicite, sans quoi gcloud prendrait la virgule
          # de la liste d'origines pour un séparateur de variables.
          gcloud run services update "$BACKEND_SERVICE" --region "$GCP_REGION" \
            --update-env-vars "^##^ALLOWED_ORIGINS_EXTRA=$origines##FRONTEND_URL=$adresse_publique"
          echo "Origines autorisées : $origines"
          echo "Liens des e-mails : $adresse_publique"

      - name: Smoke tests
        run: |
          BACK="${{ steps.back.outputs.url }}"
          FRONT="${{ steps.front.outputs.url }}"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$BACK/health"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$BACK/openapi.json"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$FRONT/"
          # L'appel avec l'en-tête Origin du frontend de test doit être accepté.
          curl -fsS -o /dev/null -H "Origin: $FRONT" "$BACK/health"
          # Le backend en ligne est bien celui de ce déploiement.
          en_ligne=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$BACK/health" | python3 -c "import json,sys; print(json.load(sys.stdin).get('version') or '')")
          if [ "$en_ligne" != "$VERSION" ]; then
            echo "::error::/health annonce « $en_ligne » au lieu de $VERSION."
            exit 1
          fi
          echo "/health annonce $VERSION."

      # Après les tests de fumée seulement : une étiquette = un site qui a démarré.
      - name: Poser l'étiquette de version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Site de paie déployé depuis ${{ github.ref_name }}" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
          echo "Étiquette $VERSION posée sur ${GITHUB_SHA:0:8}."

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Environnement de test"
            echo ""
            echo "- Backend : ${{ steps.back.outputs.url }}"
            echo "- Frontend : ${{ steps.front.outputs.url }}"
            echo "- Version : $VERSION"
            echo "- Branche déployée : ${{ github.ref_name }}"
            echo "- Migration appliquée : ${{ inputs.migration || 'aucune' }}"
          } >> "$GITHUB_STEP_SUMMARY"
