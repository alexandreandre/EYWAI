# Prévient chaque salarié le jour où son bulletin validé lui est remis (D5 :
# date de mise à disposition réglée par la société, le 1er du mois suivant par
# défaut). Un bulletin validé après cette date est notifié à sa validation.
name: Payslips remise dispatch

on:
  workflow_dispatch:
  # Cron coupé jusqu'à la mise en production, comme les relances RH (même
  # secret SUPABASE_SERVICE_ROLE_KEY et même configuration SMTP : voir
  # hr-deadline-reminders-dispatch.yml). Il rattrape 7 jours de remises.
  # schedule:
  #   - cron: "30 5 * * *"

jobs:
  dispatch:
    name: Notifier les bulletins remis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Notifier les bulletins remis ce jour
        run: python scripts/notifier_bulletins_remis.py
