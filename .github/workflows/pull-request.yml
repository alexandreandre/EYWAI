# 1) Chaque PR → zip avec liste des fichiers + stats du diff (artifact).
# 2) Déclenchement manuel (Actions → Run workflow) → revue PR complète (Cursor Agent,
#    secret CURSOR_API_KEY) : lecture fonctionnelle, qualité, conventions ; tout en français.
name: Pull requests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Numéro de la PR (ex. 42)
        required: true
        type: string

jobs:
  artefact-contexte:
    if: github.event_name == 'pull_request'
    name: Zip contexte (diff + fichiers)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer le dossier
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p pr-context
          echo "PR #${{ github.event.pull_request.number }} — ${{ github.head_ref }} → ${{ github.base_ref }}" > pr-context/summary.txt
          echo "" >> pr-context/summary.txt
          git diff --stat "${BASE}"..."${HEAD}" > pr-context/diff-stat.txt
          git diff --name-only "${BASE}"..."${HEAD}" > pr-context/files.txt
          {
            echo "## Résumé"
            cat pr-context/summary.txt
            echo ""
            echo "## git diff --stat"
            cat pr-context/diff-stat.txt
            echo ""
            echo "## Fichiers modifiés"
            cat pr-context/files.txt
          } > pr-context/README.txt
          cp pr-context/README.txt pr-context/full-context.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-context
          path: pr-context/
          retention-days: 14

  commentaire-ia:
    if: github.event_name == 'workflow_dispatch'
    name: Revue PR Cursor (commentaire)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier CURSOR_API_KEY
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "::error::Ajoute le secret CURSOR_API_KEY (Settings → Secrets → Actions). Génération : tableau de bord Cursor → Cloud Agents / clés API."
            exit 1
          fi

      - name: Installer le CLI Cursor
        run: |
          set -euo pipefail
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          agent --version

      - name: Préparer le contexte (diff + métadonnées PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" --repo "${{ github.repository }}" > pr.diff
          gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
            --json title,body,author,baseRefName,headRefName,additions,deletions,changedFiles \
            > pr-meta.json
          python3 <<'PY'
          import pathlib
          p = pathlib.Path("pr.diff")
          text = p.read_text(encoding="utf-8", errors="replace")
          max_len = 150_000
          if len(text) > max_len:
              p.write_text(text[:max_len] + "\n\n[… diff tronqué …]\n", encoding="utf-8")
          PY

      - name: Générer le commentaire avec Cursor Agent et le publier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURSOR_AGENT_MODEL: ${{ vars.CURSOR_AGENT_MODEL || 'gpt-5.2' }}
        run: |
          set -euo pipefail
          # Revue complète en français ; modèle = vars.CURSOR_AGENT_MODEL (sinon défaut doc Cursor).
          # ask + print + trust : analyse headless sans modifier le dépôt.
          python3 <<'PY'
          import os
          from pathlib import Path
          from textwrap import dedent

          pr = os.environ["PR_NUMBER"]
          repo = os.environ["GITHUB_REPOSITORY"]
          prompt = dedent(
              f"""
              Tu es un reviewer senior. Tu disposes à la racine du dépôt cloné de :
              - pr-meta.json : titre, description, auteur, branches base/tête, stats (additions, deletions, changedFiles) de la PR #{pr} sur {repo} ;
              - pr.diff : le diff GitHub de cette PR (peut être tronqué en fin de fichier).

              Produit UNE revue de pull request complète, destinée à l'équipe produit / dev, ENTIÈREMENT en français (aucune phrase en anglais).

              Style et niveau :
              - Priorité au **fonctionnel** : à quoi ça sert pour l'utilisateur ou le métier, parcours impactés, comportement attendu vs risques de régression. Évite le jargon technique inutile ; n'entre dans le détail d'implémentation que si c'est important (sécurité, données, cas limites).
              - Indique si la PR semble **bien réalisée** dans l'ensemble (oui / partiellement / doute, avec justification courte). Reste honnête : si le diff ne suffit pas, dis-le.

              Structure du commentaire (Markdown, titres ## / ###, listes à puces) :
              1. **Synthèse** — en 3 à 5 phrases : objectif fonctionnel, périmètre, verdict rapide.
              2. **Changements notables** — ce qui change côté produit ou flux (sans recopier le diff ligne par ligne).
              3. **Qualité et pertinence** — la solution est-elle cohérente avec l'intention ? points forts et faiblesses fonctionnelles.
              4. **Conventions et cohérence** — nommage, structure des fichiers, style aligné avec le reste du dépôt ; tu peux ouvrir quelques fichiers du repo (ex. GUIDE-DEV.md, README, configs, fichiers voisins des changements) si ça aide à juger les conventions, sans tout scanner.
              5. **Risques et tests** — régressions possibles, cas à tester manuellement ou automatiquement.
              6. **Avant merge** — liste courte et actionnable de vérifications ou ajustements souhaitables.

              Contraintes : ne pas coller le diff brut ; pas de mention d'autres outils d'IA ; ton professionnel et direct.
              """
          ).strip()
          Path("cursor-prompt.txt").write_text(prompt + "\n", encoding="utf-8")
          PY

          agent --print --trust --mode ask \
            --model "${CURSOR_AGENT_MODEL}" \
            -p "$(cat cursor-prompt.txt)" \
            > cursor-comment.md

          if [ ! -s cursor-comment.md ]; then
            echo "::error::Sortie Cursor vide (cursor-comment.md)."
            exit 1
          fi

          gh pr comment "${PR_NUMBER}" --repo "${{ github.repository }}" --body-file cursor-comment.md
