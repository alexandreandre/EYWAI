# Exécution automatique des exports planifiés compta / banque.
name: Scheduled exports dispatch

on:
  workflow_dispatch:
  schedule:
    # Toutes les heures — vérifie les plannings dont next_run_at est dépassé
    - cron: "0 * * * *"

jobs:
  dispatch:
    name: Run due export schedules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter les plannings échus
        run: python scripts/run_scheduled_exports.py
