# Smoke — vérifie toutes les heures que le site où l'on travaille répond,
# SANS s'y connecter et sans rien y écrire (deux GET anonymes).
# Un échec = run rouge → notification GitHub au propriétaire du dépôt.
# C'est le « Checkly maison » : suffisant tant qu'on n'a pas besoin de
# scénarios connectés multi-régions.
#
# Jusqu'à la mise en production (décision du 25/09/2026 : la base de test
# devient la prod), la paie réelle se fait sur le site de test : c'est lui
# qu'on surveille. À la bascule, remettre FRONTEND et BACKEND sur la prod
# (sirh-frontend-505040845625 et sirh-backend-505040845625).

name: Smoke prod (horaire)

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

env:
  FRONTEND: https://sirh-frontend-test-505040845625.europe-west1.run.app
  BACKEND: https://sirh-backend-test-505040845625.europe-west1.run.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Frontend prod servi
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/front.html -w '%{http_code}' --max-time 30 \
              $FRONTEND/) && break || sleep 10
          done
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo '::error::Frontend prod ne répond pas en 200'; exit 1; }
          grep -q '<div id="root"' /tmp/front.html || { echo '::error::La page servie ne contient pas l’app React'; exit 1; }

      - name: Bundle JS servi (pas seulement la coquille HTML)
        run: |
          js=$(grep -oE 'src="[^"]+\.js"' /tmp/front.html | head -1 | sed 's/src="//;s/"$//')
          [ -n "$js" ] || { echo '::error::Aucun script JS référencé dans index.html'; exit 1; }
          case "$js" in /*) url="$FRONTEND$js" ;; *) url="$js" ;; esac
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url")
          echo "$url → HTTP $code"
          [ "$code" = "200" ] || { echo '::error::Le bundle JS de la prod ne se charge pas'; exit 1; }

      - name: Backend prod en bonne santé
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 \
              $BACKEND/health) && break || sleep 10
          done
          echo "HTTP $code — $(cat /tmp/health.json)"
          [ "$code" = "200" ] || { echo '::error::Backend prod /health ne répond pas en 200'; exit 1; }
