# Déploiement Cloud Run après une CI verte sur main, ou via Run workflow.
#
# Enchaînement : push main → CI verte → Deploy → staging → (gate) → production.
# Le checkout et les tags d'image utilisent le SHA du run CI qui vient de réussir.
#
# Variables / secrets requis : voir .github/workflows/GUIDE_SIMPLE.md
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME || 'sirh-backend' }}
  FRONTEND_SERVICE_NAME: ${{ vars.FRONTEND_SERVICE_NAME || 'sirh-frontend' }}

jobs:
  # ----------------------------------------------------------------------------
  # 1) Build + push images Docker → GCR
  # ----------------------------------------------------------------------------
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Vérifier variables et secrets requis
        run: |
          missing=""
          [ -z "${{ vars.GCP_PROJECT_ID }}" ] && missing="$missing GCP_PROJECT_ID(var)"
          [ -z "${{ vars.VITE_API_URL }}" ]   && missing="$missing VITE_API_URL(var)"
          [ -z "${{ secrets.GCP_SA_KEY }}" ]  && missing="$missing GCP_SA_KEY(secret)"
          [ -z "${{ secrets.SUPABASE_URL }}" ] && missing="$missing SUPABASE_URL(secret)"
          [ -z "${{ secrets.SUPABASE_KEY }}" ] && missing="$missing SUPABASE_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Manquant dans Settings → Secrets and variables → Actions :$missing"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Pre-pull images de base (mirror GCR, retry)
        run: |
          images=(
            "mirror.gcr.io/library/python:3.11-slim"
            "mirror.gcr.io/library/node:22-alpine"
            "mirror.gcr.io/library/nginx:alpine"
          )
          for img in "${images[@]}"; do
            for attempt in 1 2 3; do
              echo "Pull ${img} (tentative ${attempt}/3)"
              if docker pull "${img}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "::error::Échec pull ${img} après 3 tentatives"
                exit 1
              fi
              sleep 20
            done
          done

      - id: images
        run: |
          P="${{ vars.GCP_PROJECT_ID }}"
          echo "backend=gcr.io/${P}/sirh-backend:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=gcr.io/${P}/sirh-frontend:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.images.outputs.backend }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_APP_BUILD_ID=${{ env.DEPLOY_SHA }}
          tags: ${{ steps.images.outputs.frontend }}

  # ----------------------------------------------------------------------------
  # 1bis) Migrations Supabase — appliquées avant tout déploiement backend
  # Idempotentes (ADD COLUMN IF NOT EXISTS / INSERT ... WHERE NOT EXISTS).
  # Bloquant : si la migration échoue, on ne déploie pas de code qui en dépend.
  # Secret requis : SUPABASE_DB_URL (connexion Postgres du projet, ex. pooler).
  # ----------------------------------------------------------------------------
  migrate:
    name: DB migrations (supabase db push)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Vérifier secret SUPABASE_DB_URL
        id: db_url
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_DB_URL absent — supabase db push ignoré (migrations à appliquer manuellement si besoin). Voir GUIDE_SIMPLE.md."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.db_url.outputs.skip != 'true'
        with:
          version: latest

      - name: supabase db push
        if: steps.db_url.outputs.skip != 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

  # ----------------------------------------------------------------------------
  # 2) Staging — déploiement automatique (après migrations)
  # ----------------------------------------------------------------------------
  staging:
    name: Deploy staging
    needs: [build, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ env.BACKEND_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.backend_image }}
          # Génération bulletins (WeasyPrint) : 512Mi provoque des OOM → coupure sans CORS côté navigateur
          flags: '--memory=2Gi --timeout=900'
          env_vars: |-
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            PISTE_CLIENT_ID=${{ secrets.PISTE_CLIENT_ID }}
            PISTE_CLIENT_SECRET=${{ secrets.PISTE_CLIENT_SECRET }}
          env_vars_update_strategy: merge

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ env.FRONTEND_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.frontend_image }}

      - name: Smoke tests staging
        run: |
          BACK=$(gcloud run services describe "${BACKEND_SERVICE_NAME}" \
            --region "${GCP_REGION}" --format 'value(status.url)')
          FRONT=$(gcloud run services describe "${FRONTEND_SERVICE_NAME}" \
            --region "${GCP_REGION}" --format 'value(status.url)')
          echo "Backend : $BACK ; Frontend : $FRONT"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${BACK}/health"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "${BACK}/openapi.json"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "${FRONT}/"

  # ----------------------------------------------------------------------------
  # 3) Production — gate via environnement GitHub `production`
  # ----------------------------------------------------------------------------
  production:
    name: Deploy production
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production
    env:
      BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME_PROD || vars.BACKEND_SERVICE_NAME || 'sirh-backend' }}
      FRONTEND_SERVICE_NAME: ${{ vars.FRONTEND_SERVICE_NAME_PROD || vars.FRONTEND_SERVICE_NAME || 'sirh-frontend' }}
      GCP_REGION: ${{ vars.GCP_REGION_PROD || vars.GCP_REGION || 'europe-west1' }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ env.BACKEND_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.backend_image }}
          flags: '--memory=2Gi --timeout=900'
          env_vars: |-
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            PISTE_CLIENT_ID=${{ secrets.PISTE_CLIENT_ID }}
            PISTE_CLIENT_SECRET=${{ secrets.PISTE_CLIENT_SECRET }}
          env_vars_update_strategy: merge

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ env.FRONTEND_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.frontend_image }}

      - name: Smoke tests production
        run: |
          BACK=$(gcloud run services describe "${BACKEND_SERVICE_NAME}" \
            --region "${GCP_REGION}" --format 'value(status.url)')
          FRONT=$(gcloud run services describe "${FRONTEND_SERVICE_NAME}" \
            --region "${GCP_REGION}" --format 'value(status.url)')
          echo "Backend : $BACK ; Frontend : $FRONT"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${BACK}/health"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "${BACK}/openapi.json"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "${FRONT}/"
