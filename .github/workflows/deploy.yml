# Déploiement Cloud Run après une CI verte sur main, ou via Run workflow.
#
# Enchaînement : push main → CI verte → Deploy → environnement de test → (gate) → production.
# Le checkout et les tags d'image utilisent le SHA du run CI qui vient de réussir.
#
# Variables / secrets requis : voir .github/workflows/GUIDE_SIMPLE.md
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME || 'sirh-backend' }}
  FRONTEND_SERVICE_NAME: ${{ vars.FRONTEND_SERVICE_NAME || 'sirh-frontend' }}

jobs:
  # ----------------------------------------------------------------------------
  # 1) Gate sécurité Copilot — bloquant pour workflow_run et workflow_dispatch
  # ----------------------------------------------------------------------------
  copilot-security-gate:
    name: Copilot security gate
    runs-on: ubuntu-latest
    env:
      # Valeurs factices hermétiques : les suites utilisent mocks/clients mémoire.
      SUPABASE_URL: https://ci-fake.supabase.co
      SUPABASE_KEY: ci-fake-anon-key
      OPENROUTER_API_KEY: sk-or-ci-fake
      COPILOT_RH_DATA_ENABLED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Paquets système (cairo / pango pour weasyprint à l'import)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgobject-2.0-0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest sécurité Copilot (bloquant)
        run: >-
          python -m pytest
          tests/unit/copilot
          tests/integration/copilot
          tests/unit/access_control
          -v --tb=short -p no:cacheprovider

  # ----------------------------------------------------------------------------
  # 2) Build + push images Docker → GCR
  # ----------------------------------------------------------------------------
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}
      frontend_test_image: ${{ steps.images.outputs.frontend_test }}
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Vérifier variables et secrets requis
        run: |
          missing=""
          [ -z "${{ vars.GCP_PROJECT_ID }}" ] && missing="$missing GCP_PROJECT_ID(var)"
          [ -z "${{ vars.VITE_API_URL }}" ]   && missing="$missing VITE_API_URL(var)"
          [ -z "${{ secrets.GCP_SA_KEY }}" ]  && missing="$missing GCP_SA_KEY(secret)"
          [ -z "${{ secrets.SUPABASE_URL }}" ] && missing="$missing SUPABASE_URL(secret)"
          [ -z "${{ secrets.SUPABASE_KEY }}" ] && missing="$missing SUPABASE_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Manquant dans Settings → Secrets and variables → Actions :$missing"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Pre-pull images de base (mirror GCR, retry)
        run: |
          images=(
            "mirror.gcr.io/library/python:3.11-slim"
            "mirror.gcr.io/library/node:22-alpine"
            "mirror.gcr.io/library/nginx:alpine"
          )
          for img in "${images[@]}"; do
            for attempt in 1 2 3; do
              echo "Pull ${img} (tentative ${attempt}/3)"
              if docker pull "${img}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "::error::Échec pull ${img} après 3 tentatives"
                exit 1
              fi
              sleep 20
            done
          done

      - id: images
        run: |
          P="${{ vars.GCP_PROJECT_ID }}"
          echo "backend=gcr.io/${P}/sirh-backend:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=gcr.io/${P}/sirh-frontend:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_test=gcr.io/${P}/sirh-frontend:test-${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.images.outputs.backend }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_APP_BUILD_ID=${{ env.DEPLOY_SHA }}
          tags: ${{ steps.images.outputs.frontend }}

      # Seconde image frontend, pour l'environnement de test : VITE_API_URL et
      # VITE_APP_ENV sont figés au build, il faut donc un bundle distinct.
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL_TEST }}
            VITE_APP_ENV=test
            VITE_APP_BUILD_ID=${{ env.DEPLOY_SHA }}
          tags: ${{ steps.images.outputs.frontend_test }}

  # ----------------------------------------------------------------------------
  # 2bis) Migrations Supabase — appliquées avant tout déploiement backend
  # Idempotentes (ADD COLUMN IF NOT EXISTS / INSERT ... WHERE NOT EXISTS).
  # Bloquant : si la migration échoue, on ne déploie pas de code qui en dépend.
  # Secret requis : SUPABASE_DB_URL (connexion Postgres du projet, ex. pooler).
  # ----------------------------------------------------------------------------
  migrate:
    name: DB migrations (supabase db push)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Un déploiement qui saute silencieusement ses migrations est un
      # déploiement à moitié fait : le code part, le schéma non. C'était un
      # simple avertissement, invisible dans un run vert ; c'est désormais un
      # échec franc.
      - name: Vérifier secret SUPABASE_DB_URL
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::SUPABASE_DB_URL absent : les migrations ne peuvent pas être appliquées. Le déploiement est interrompu plutôt que de publier du code sur un schéma non migré. Voir GUIDE_SIMPLE.md."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `--include-all` : une migration appliquée via l'API Supabase reçoit
      # l'horodatage du moment, alors que les fichiers du dépôt sont numérotés à
      # la main. Une migration écrite ici peut donc porter un numéro antérieur à
      # la dernière enregistrée en base, et la CLI refuse alors de l'appliquer
      # (« Found local migration files to be inserted before the last migration
      # on remote database »). C'est ce qui a bloqué tous les déploiements du
      # 04/08 au 07/08. Le drapeau applique les migrations en attente dans
      # l'ordre de leur numéro, sans exiger qu'elles soient les plus récentes.
      - name: supabase db push
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --include-all --db-url "$SUPABASE_DB_URL"

  # ----------------------------------------------------------------------------
  # 3) Environnement de test — déploiement automatique, marche avant la prod.
  #
  # Remplace l'ancien job « staging », qui déployait en réalité sur LES MÊMES
  # services Cloud Run et LA MÊME base que la production : aucune variable
  # BACKEND_SERVICE_NAME_PROD n'étant définie, staging et production visaient
  # tous deux sirh-backend / sirh-frontend. La production était donc mise à jour
  # AVANT le gate d'approbation, qui ne protégeait rien.
  #
  # Ici, services et base sont ceux du test : la production ne peut plus être
  # touchée avant l'approbation.
  # ----------------------------------------------------------------------------
  test-env:
    name: Deploy test env
    needs: [copilot-security-gate, build, migrate]
    runs-on: ubuntu-latest
    env:
      BACKEND_SERVICE_NAME: sirh-backend-test
      FRONTEND_SERVICE_NAME: sirh-frontend-test
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ env.BACKEND_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.backend_image }}
          flags: '--memory=2Gi --timeout=900'
          env_vars: |-
            APP_ENV=test
            EMAIL_FORCE_REDIRECT_TO=${{ secrets.TEST_EMAIL_REDIRECT_TO }}
            ALLOWED_ORIGINS_EXTRA=${{ vars.FRONTEND_URL_TEST }}
            SUPABASE_URL=${{ secrets.SUPABASE_TEST_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_TEST_KEY }}
            SECRET_ENCRYPTION_KEY=${{ secrets.SECRET_ENCRYPTION_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            COPILOT_RH_DATA_ENABLED=true
            GITHUB_REPO=${{ github.repository }}
          env_vars_update_strategy: merge

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ env.FRONTEND_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.frontend_test_image }}

      - name: Smoke tests environnement de test
        run: |
          BACK=$(gcloud run services describe "${BACKEND_SERVICE_NAME}" \
            --region "${GCP_REGION}" --format 'value(status.url)')
          FRONT=$(gcloud run services describe "${FRONTEND_SERVICE_NAME}" \
            --region "${GCP_REGION}" --format 'value(status.url)')
          echo "Backend test : $BACK ; Frontend test : $FRONT"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${BACK}/health"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "${BACK}/openapi.json"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "${FRONT}/"
          # L'environnement doit bien se déclarer « test ».
          curl -fsS "${BACK}/api/test-env/status" | grep -q '"is_test":true'

  # ----------------------------------------------------------------------------
  # 4) Production — gate via environnement GitHub `production`
  # ----------------------------------------------------------------------------
  production:
    name: Deploy production
    needs: [copilot-security-gate, build, test-env]
    runs-on: ubuntu-latest
    environment: production
    env:
      BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME_PROD || vars.BACKEND_SERVICE_NAME || 'sirh-backend' }}
      FRONTEND_SERVICE_NAME: ${{ vars.FRONTEND_SERVICE_NAME_PROD || vars.FRONTEND_SERVICE_NAME || 'sirh-frontend' }}
      GCP_REGION: ${{ vars.GCP_REGION_PROD || vars.GCP_REGION || 'europe-west1' }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ env.BACKEND_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.backend_image }}
          flags: '--memory=2Gi --timeout=900'
          env_vars: |-
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            SECRET_ENCRYPTION_KEY=${{ secrets.SECRET_ENCRYPTION_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            COPILOT_RH_DATA_ENABLED=true
            PISTE_CLIENT_ID=${{ secrets.PISTE_CLIENT_ID }}
            PISTE_CLIENT_SECRET=${{ secrets.PISTE_CLIENT_SECRET }}
            EMAIL_FORCE_REDIRECT_TO=${{ secrets.TEST_EMAIL_REDIRECT_TO }}
          env_vars_update_strategy: merge

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ env.FRONTEND_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.frontend_image }}

      - name: Smoke tests production
        run: |
          BACK=$(gcloud run services describe "${BACKEND_SERVICE_NAME}" \
            --region "${GCP_REGION}" --format 'value(status.url)')
          FRONT=$(gcloud run services describe "${FRONTEND_SERVICE_NAME}" \
            --region "${GCP_REGION}" --format 'value(status.url)')
          echo "Backend : $BACK ; Frontend : $FRONT"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${BACK}/health"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "${BACK}/openapi.json"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "${FRONT}/"

  # ----------------------------------------------------------------------------
  # 5) Verdict — le run doit dire la vérité sur ce qui a été déployé.
  #
  # Quand la CI déclenchante échoue, ou quand un job amont tombe, tous les jobs
  # de déploiement passent en `skipped` et GitHub affiche le run en **success**.
  # C'est ainsi que l'arrêt du 04/08 au 07/08 est passé inaperçu : des runs verts
  # qui ne déployaient rien, pendant que la production restait figée trois jours.
  #
  # Ce job échoue dès que la production n'a pas réellement reçu le code. Un run
  # vert signifie désormais « déployé », et rien d'autre.
  # ----------------------------------------------------------------------------
  verdict:
    name: Verdict du déploiement
    needs: [copilot-security-gate, build, migrate, test-env, production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: La production a-t-elle été déployée ?
        env:
          GATE: ${{ needs.copilot-security-gate.result }}
          BUILD: ${{ needs.build.result }}
          MIGRATE: ${{ needs.migrate.result }}
          TEST_ENV: ${{ needs.test-env.result }}
          PROD: ${{ needs.production.result }}
        run: |
          {
            echo "| Étape | Résultat |"
            echo "|---|---|"
            echo "| Gate sécurité Copilot | $GATE |"
            echo "| Build images | $BUILD |"
            echo "| Migrations | $MIGRATE |"
            echo "| Environnement de test | $TEST_ENV |"
            echo "| **Production** | **$PROD** |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PROD" = "success" ]; then
            echo "Production déployée."
            exit 0
          fi

          echo "::error::La production N'A PAS été déployée (job production : $PROD)."
          case "$PROD" in
            skipped)
              echo "::error::Un job amont a échoué ou été sauté — souvent une CI déclenchante en échec, ou les migrations. Ne pas se fier au statut global du run."
              ;;
            failure)
              echo "::error::Le déploiement production a échoué : consulter ses logs."
              ;;
            cancelled)
              echo "::error::Déploiement production annulé (approbation refusée ou expirée)."
              ;;
          esac
          exit 1
