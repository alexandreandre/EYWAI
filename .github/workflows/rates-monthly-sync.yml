# Mise à jour mensuelle du référentiel de taux sur la base de TEST
# (démo test paie). 05:15 UTC les 1er, 2 et 3 : un mois déjà réussi s'arrête tout de suite.
# Les secrets SUPABASE_URL / SERVICE_KEY sans suffixe TEST pointent la production :
# ce job ne doit pas les utiliser.
name: Rates monthly sync (test)

on:
  workflow_dispatch:
    inputs:
      force:
        description: Relancer toutes les sources, même celles déjà réussies
        type: boolean
        default: false
  schedule:
    - cron: "15 5 1-3 * *"

jobs:
  sync:
    name: Mise à jour mensuelle des taux
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: backend
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier secrets Supabase
        run: |
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Secret SUPABASE_URL manquant."
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -z "${SUPABASE_SERVICE_KEY:-}" ] && [ -z "${SUPABASE_KEY:-}" ]; then
            echo "::error::Aucune clé Supabase admin trouvée."
            exit 1
          fi

      - name: Lancer la mise à jour du mois
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python scripts/run_monthly_rates_sync.py --force
          else
            python scripts/run_monthly_rates_sync.py
          fi
