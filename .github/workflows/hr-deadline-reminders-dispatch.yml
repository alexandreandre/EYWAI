# Relances automatiques échéances RH (CDD, période d'essai, titre de séjour)
name: HR deadline reminders dispatch

on:
  workflow_dispatch:
  # Cron désactivé le 2026-08-15, en attente de la mise en production.
  #
  # Réactiver le cron et créer le secret SUPABASE_SERVICE_ROLE_KEY sont un seul
  # et même geste : sans cette clé, get_supabase_admin_client() retombe sur la
  # clé anon, RLS bloque la lecture de platform_email_settings (où vit la config
  # SMTP), et l'envoi échoue en « SMTP non configuré ». Avec elle, les relances
  # partent réellement dès l'exécution suivante, sans confirmation.
  #
  # Avant de réactiver : corriger les 2 comptes RH de Cartol Industrie qui
  # portent une adresse fabriquée non routable (@eywai.access.local). Ils sont
  # exclus des envois avec un warning, donc rien ne casse — ils ne reçoivent
  # simplement jamais rien.
  # schedule:
  #   - cron: "0 7 * * *"

jobs:
  dispatch:
    name: Send HR deadline reminders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Envoyer les relances échéances RH
        run: python scripts/send_hr_deadline_reminders.py
