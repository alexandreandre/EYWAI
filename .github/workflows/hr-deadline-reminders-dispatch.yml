# Relances automatiques échéances RH (CDD, période d'essai, titre de séjour)
name: HR deadline reminders dispatch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  dispatch:
    name: Send HR deadline reminders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Envoyer les relances échéances RH
        run: python scripts/send_hr_deadline_reminders.py
