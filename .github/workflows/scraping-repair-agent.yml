# Validation mensuelle des URLs officielles (scraping_sources.primary_url).
# L'agent autonome de réparation de code est désactivé par défaut.
name: Scraping source validation

on:
  workflow_dispatch:
  schedule:
    # Validation URLs officielles : 1er du mois à 5h UTC
    - cron: "0 5 1 * *"

permissions:
  contents: read

jobs:
  validate-sources:
    name: Validation URLs officielles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Vérifier secrets Supabase
        run: |
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Secret SUPABASE_URL manquant (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -z "${SUPABASE_SERVICE_KEY:-}" ] && [ -z "${SUPABASE_KEY:-}" ]; then
            echo "::error::Aucune clé Supabase admin trouvée. Définir au moins un secret parmi SUPABASE_SERVICE_ROLE_KEY, SUPABASE_SERVICE_KEY ou SUPABASE_KEY."
            exit 1
          fi

      - name: Validate official source URLs
        run: PYTHONPATH=scraping python -m agent --validate-sources
