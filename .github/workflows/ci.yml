# CI : sur chaque PR + push sur main.
#
# Philosophie : robuste, simple, pas rigide.
# - Bloquant   : ce qui ne dépend que du code (lint, build, tests unit, scan secrets).
# - Best-effort: tests d'intégration (continue-on-error) — l'info reste visible
#   dans les logs mais ne bloque ni le merge ni le déploiement.
# - Hors CI    : tests e2e (lancés en local ou via job dédié plus tard).
#
# Les tests unit sont hermétiques (mocks, pas de DB réelle) : ils tournent même
# sans secrets Supabase, grâce à des valeurs factices d'amorçage qui n'engagent
# aucun appel réseau (le client supabase-py n'effectue pas de requête à l'init).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # 1) Scan secrets (gitleaks) — bloquant
  # ----------------------------------------------------------------------------
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # 2) Backend — bloquant : ruff + tests unit + smoke import + OpenAPI artifact
  # ----------------------------------------------------------------------------
  backend:
    name: Backend (lint + unit + OpenAPI)
    runs-on: ubuntu-latest
    env:
      # Fakes acceptés : `supabase.create_client` n'appelle pas le réseau à l'init.
      # Si des secrets réels sont fournis (utile pour debug), ils sont utilisés.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ci-fake.supabase.co' }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'ci-fake-anon-key' }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || '' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENAI_API_KEY || 'sk-or-ci-fake' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Paquets système (cairo / pango pour weasyprint à l'import)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgobject-2.0-0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (info)
        continue-on-error: true
        run: ruff check . --output-format github

      - name: Smoke import (vérifie le chargement de l'app)
        run: python -c "from app.main import app; print('OK', len(app.openapi()['paths']), 'routes')"

      - name: Pytest unit (bloquant)
        run: python -m pytest tests/unit -v --tb=short -p no:cacheprovider

      - name: Scraping compile + validation (hermétique)
        run: python scraping/test_scrapers.py

      - name: Scraping pytest (fixtures + validateurs)
        run: >-
          python -m pytest
          tests/unit/scraping/test_parsers_primary.py
          tests/unit/scraping/test_parsers_secondary.py
          tests/unit/scraping/test_validation_extended.py
          tests/unit/scraping/test_orchestrator_manifest.py
          tests/unit/scraping/test_consensus.py
          tests/unit/scraping/test_vm_scraper.py
          tests/unit/scraping/test_scrapers_harness.py
          tests/unit/scraping/test_source_validator.py
          tests/unit/scraping/test_official_domains.py
          tests/unit/scraping/test_agent_safety.py
          -v --tb=short -p no:cacheprovider

      - name: OpenAPI artifact
        run: |
          python - <<'PY'
          import json
          from app.main import app
          with open("openapi.json", "w", encoding="utf-8") as f:
              json.dump(app.openapi(), f, indent=2, ensure_ascii=False)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/openapi.json
          retention-days: 14

  # ----------------------------------------------------------------------------
  # 3) Backend integration — best-effort (info, jamais bloquant)
  # Skippe si les secrets Supabase ne sont pas fournis ; sinon lance pytest
  # tests/integration. Le résultat reste visible dans les logs.
  # ----------------------------------------------------------------------------
  backend-integration:
    name: Backend integration (info)
    needs: backend
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENAI_API_KEY || 'sk-or-ci-fake' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Skip si secrets Supabase absents
        id: precheck
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "Pas de secrets Supabase : intégration skippée."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Paquets système (PDF / OCR)
        if: steps.precheck.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libffi-dev fontconfig libcairo2 \
            libpango-1.0-0 libpangocairo-1.0-0 libgobject-2.0-0 \
            poppler-utils tesseract-ocr tesseract-ocr-fra

      - uses: actions/setup-python@v5
        if: steps.precheck.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        if: steps.precheck.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest integration
        if: steps.precheck.outputs.skip != 'true'
        run: python -m pytest tests/integration -v --tb=short -p no:cacheprovider

  # ----------------------------------------------------------------------------
  # 4) Frontend — bloquant : lint + build
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Verify page import paths
        run: |
          node scripts/verify-pages-imports.mjs
          node scripts/verify-no-pages-imports-in-ui.mjs
        env:
          # Repli pour les forks sans variable dépôt ; la prod utilise vars.VITE_API_URL.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://example.com' }}
