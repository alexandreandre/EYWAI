[pytest]
# Racine du package `app` (modular monolith)
pythonpath = .
# Évite les collisions test_wiring.py (même basename dans N modules d'intégration)
addopts = --import-mode=importlib
# CI : bruit Pydantic v1-style Config + dépréciations client Supabase (hors périmètre app)
filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore:The 'timeout' parameter is deprecated:DeprecationWarning:supabase._sync.client
    ignore:The 'verify' parameter is deprecated:DeprecationWarning:supabase._sync.client
# Exécuter les tests async (async def) avec le plugin anyio
anyio_mode = auto
# Marqueurs personnalisés (complément à conftest.py)
markers =
    unit: tests unitaires (mocks, pas de DB/HTTP réels)
    integration: tests d’intégration (API, repository, wiring)
    e2e: smoke / end-to-end (désélection: pytest -m "not e2e")
    asyncio: test asynchrone (pytest-asyncio / anyio)
